<div class="hp-admin-content">
  <div class="hp-admin-header">
    <div>
      <h2 class="hp-admin-title"><i class="bi bi-building me-2"></i>Manage Hotels</h2>
      <p class="hp-admin-subtitle">Add and manage hotel listings</p>
    </div>
    <button class="hp-btn hp-btn--primary" (click)="openAdd()">
      <i class="bi bi-plus-circle me-2"></i>Add Hotel
    </button>
  </div>

  <!-- Form -->
  <div class="hp-admin-form-panel" *ngIf="showForm">
    <h5 class="fw-semibold mb-4">{{ editingHotel ? 'Edit Hotel' : 'Add New Hotel' }}</h5>
    <div class="hp-alert hp-alert--danger mb-3" *ngIf="error">{{ error }}</div>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="hp-label">Name *</label>
        <input [(ngModel)]="formData.name" class="hp-input hp-input--full" placeholder="Hotel name">
      </div>
      <div class="col-md-6">
        <label class="hp-label">Location *</label>
        <input [(ngModel)]="formData.location" class="hp-input hp-input--full" placeholder="City, Country">
      </div>
      <div class="col-md-8">
        <label class="hp-label">Description</label>
        <textarea [(ngModel)]="formData.description" class="hp-input hp-input--full hp-textarea" rows="2"></textarea>
      </div>
      <div class="col-md-4">
        <label class="hp-label">Star Rating</label>
        <select [(ngModel)]="formData.starRating" class="hp-select hp-select--full">
          <option [value]="i" *ngFor="let i of [1,2,3,4,5]">{{ i }} Star{{ i > 1 ? 's' : '' }}</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="hp-label">Amenities (comma-separated)</label>
        <input [(ngModel)]="formData.amenities" class="hp-input hp-input--full" placeholder="WiFi, Pool, Gym">
      </div>
      <div class="col-md-6">
        <label class="hp-label">Image URL</label>
        <input [(ngModel)]="formData.imageUrl" class="hp-input hp-input--full" placeholder="https://...">
      </div>
    </div>
    <div class="d-flex gap-2 mt-4">
      <button class="hp-btn hp-btn--primary" (click)="save()" [disabled]="saving">
        <span class="hp-spinner" *ngIf="saving"></span>
        {{ saving ? 'Saving...' : 'Save Hotel' }}
      </button>
      <button class="hp-btn hp-btn--ghost" (click)="showForm = false">Cancel</button>
    </div>
  </div>

  <!-- Table -->
  <div class="hp-state-center py-5" *ngIf="loading">
    <div class="hp-spinner hp-spinner--lg"></div>
  </div>

  <div class="hp-table-wrap" *ngIf="!loading">
    <table class="hp-table">
      <thead>
        <tr>
          <th>Hotel</th>
          <th>Location</th>
          <th>Stars</th>
          <th>Rooms</th>
          <th>Min Price</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let h of hotels">
          <td>
            <div class="d-flex align-items-center gap-3">
              <img [src]="h.imageUrl" style="width:50px;height:40px;object-fit:cover;border-radius:6px"
                   onerror="this.src='https://via.placeholder.com/50x40'">
              <span class="fw-semibold">{{ h.name }}</span>
            </div>
          </td>
          <td>{{ h.location }}</td>
          <td><span style="font-size:0.9rem">
            <ng-container *ngFor="let _ of getStarArray(h.starRating)">★</ng-container>
          </span></td>
          <td>{{ h.roomCount }}</td>
          <td>₹{{ h.minPrice }}</td>
          <td><span [class]="h.isActive ? 'hp-badge hp-badge--success' : 'hp-badge hp-badge--danger'">
            {{ h.isActive ? 'Active' : 'Inactive' }}
          </span></td>
          <td>
            <div class="hp-action-btns">
              <button class="hp-btn hp-btn--icon hp-btn--icon-edit" (click)="openEdit(h)">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="hp-btn hp-btn--icon hp-btn--icon-delete" (click)="delete(h.id)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="hp-empty-state hp-empty-state--sm" *ngIf="hotels.length === 0">
      <i class="bi bi-building hp-empty-icon"></i>
      <p>No hotels found</p>
    </div>
  </div>
</div>
