<div class="auth-wrapper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card">
          <div class="auth-header">
            <i class="bi bi-building fs-1 mb-2 d-block"></i>
            <h2>Welcome Back</h2>
            <p>Sign in to your account</p>
          </div>

          <div class="auth-body">
            <div class="alert alert-danger" *ngIf="error">
              <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="mb-4">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                  <input formControlName="email" type="email" class="form-control form-control-custom"
                         placeholder="you@example.com">
                </div>
                <div class="text-danger small mt-1"
                     *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                  Valid email is required.
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock"></i></span>
                  <input formControlName="password" type="password" class="form-control form-control-custom"
                         placeholder="Your password">
                </div>
                <div class="text-danger small mt-1"
                     *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                  Password is required.
                </div>
              </div>

              <button type="submit" class="btn btn-primary-custom w-100 py-3" [disabled]="loading">
                <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>
                <i class="bi bi-box-arrow-in-right me-2" *ngIf="!loading"></i>
                {{ loading ? 'Signing in...' : 'Sign In' }}
              </button>
            </form>

            <hr class="my-4">
            <p class="text-center mb-0">
              Don't have an account?
              <a routerLink="/register" class="text-primary fw-semibold">Create one</a>
            </p>

            <div class="mt-3 p-3 bg-light rounded small">
              <strong>Demo credentials:</strong><br>
              Admin: admin@hotel.com / Admin@123<br>
              User: john@example.com / User@123
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
