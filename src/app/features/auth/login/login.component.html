<div class="hp-auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">

        <div class="hp-auth-brand">
          <div class="hp-logo-icon"><i class="bi bi-building"></i></div>
          <div class="hp-logo-text">HotelPro</div>
        </div>

        <div class="hp-auth-card">
          <div class="hp-auth-card__header">
            <h1>Welcome back</h1>
            <p>Sign in to your account</p>
          </div>

          <div class="hp-auth-card__body">
            <div class="hp-alert hp-alert--danger" *ngIf="error">
              <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
            </div>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="hp-field mb-3">
                <label class="hp-label">Email address</label>
                <div class="hp-input-group">
                  <i class="bi bi-envelope hp-input-icon"></i>
                  <input formControlName="email" type="email" class="hp-input" placeholder="you@example.com">
                </div>
                <span class="hp-field-error" *ngIf="f['email'].invalid && f['email'].touched">
                  Valid email required
                </span>
              </div>

              <div class="hp-field mb-4">
                <label class="hp-label">Password</label>
                <div class="hp-input-group">
                  <i class="bi bi-lock hp-input-icon"></i>
                  <input formControlName="password" type="password" class="hp-input" placeholder="Your password">
                </div>
                <span class="hp-field-error" *ngIf="f['password'].invalid && f['password'].touched">
                  Password required
                </span>
              </div>

              <button type="submit" class="hp-btn hp-btn--primary hp-btn--full" [disabled]="loading">
                <span class="hp-spinner" *ngIf="loading"></span>
                <i class="bi bi-box-arrow-in-right" *ngIf="!loading"></i>
                {{ loading ? 'Signing in...' : 'Sign In' }}
              </button>
            </form>

           
          <div class="hp-auth-card__footer">
            Don't have an account?
            <a routerLink="/register" class="hp-link">Create one</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
