<div class="hp-auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">

        <div class="hp-auth-brand">
          <div class="hp-logo-icon"><i class="bi bi-building"></i></div>
          <div class="hp-logo-text">HotelPro</div>
        </div>

        <div class="hp-auth-card" *ngIf="!success">
          <div class="hp-auth-card__header">
            <h1>Create account</h1>
            <p>Join HotelPro today</p>
          </div>
          <div class="hp-auth-card__body">
            <div class="hp-alert hp-alert--danger" *ngIf="error">
              <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
            </div>
            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="hp-field mb-3">
                <label class="hp-label">Full name</label>
                <div class="hp-input-group">
                  <i class="bi bi-person hp-input-icon"></i>
                  <input formControlName="fullName" type="text" class="hp-input" placeholder="John Doe">
                </div>
                <span class="hp-field-error" *ngIf="f['fullName'].invalid && f['fullName'].touched">Min 2 characters</span>
              </div>
              <div class="hp-field mb-3">
                <label class="hp-label">Email address</label>
                <div class="hp-input-group">
                  <i class="bi bi-envelope hp-input-icon"></i>
                  <input formControlName="email" type="email" class="hp-input" placeholder="you@example.com">
                </div>
                <span class="hp-field-error" *ngIf="f['email'].invalid && f['email'].touched">Valid email required</span>
              </div>
              <div class="hp-field mb-4">
                <label class="hp-label">Password</label>
                <div class="hp-input-group">
                  <i class="bi bi-lock hp-input-icon"></i>
                  <input formControlName="password" type="password" class="hp-input" placeholder="Min 6 characters">
                </div>
                <span class="hp-field-error" *ngIf="f['password'].invalid && f['password'].touched">Min 6 characters</span>
              </div>
              <button type="submit" class="hp-btn hp-btn--primary hp-btn--full" [disabled]="loading">
                <span class="hp-spinner" *ngIf="loading"></span>
                <i class="bi bi-person-check" *ngIf="!loading"></i>
                {{ loading ? 'Creating...' : 'Create Account' }}
              </button>
            </form>
          </div>
          <div class="hp-auth-card__footer">
            Already have an account? <a routerLink="/login" class="hp-link">Sign in</a>
          </div>
        </div>

        <div class="hp-auth-card" *ngIf="success">
          <div class="hp-auth-card__body text-center py-4">
            <div class="hp-verify-icon hp-verify-icon--success mx-auto mb-3">
              <i class="bi bi-envelope-check-fill"></i>
            </div>
            <h3 class="fw-bold mb-2">Check your email!</h3>
            <p class="text-muted">We've sent a verification link and welcome email. Redirecting...</p>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
