<nav class="hp-nav">
  <div class="container hp-nav__inner">

    <!-- Back button (shows on non-home pages) -->
    <button class="hp-nav__back" *ngIf="showBack" (click)="goBack()">
      <i class="bi bi-arrow-left"></i>
      <span>Back</span>
    </button>

    <!-- Brand -->
    <a class="hp-nav__brand" routerLink="/hotels">
      <div class="hp-nav__logo"><i class="bi bi-building"></i></div>
      <span>HotelPro</span>
    </a>

    <!-- Toggle for mobile -->
    <button class="hp-nav__toggle navbar-toggler" type="button" (click)="toggleMenu()">
      <i class="bi bi-list"></i>
    </button>

    <div class="navbar-collapse" [class.hp-nav__expanded]="menuOpen" id="mainNav">
      <!-- Center Links -->
      <ul class="hp-nav__links">
        <li>
          <a routerLink="/hotels" routerLinkActive="hp-nav__link--active"
             class="hp-nav__link">
            <i class="bi bi-search me-1"></i>Hotels
          </a>
        </li>
        <li *ngIf="auth.isLoggedIn() && !auth.isAdmin()">
          <a routerLink="/my-bookings" routerLinkActive="hp-nav__link--active"
             class="hp-nav__link">
            <i class="bi bi-calendar-check me-1"></i>My Bookings
          </a>
        </li>
        <li *ngIf="auth.isAdmin()">
          <a routerLink="/admin" routerLinkActive="hp-nav__link--active"
             class="hp-nav__link">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
      </ul>

      <!-- Right side auth -->
      <div class="hp-nav__auth">

        <!-- NOT logged in -->
        <ng-container *ngIf="!auth.isLoggedIn()">
          <a routerLink="/login" class="hp-nav__link-plain">
            <i class="bi bi-box-arrow-in-right me-1"></i>Login
          </a>
          <a routerLink="/register" class="hp-btn hp-btn--primary hp-btn--sm">
            <i class="bi bi-person-plus me-1"></i>Sign Up
          </a>
        </ng-container>

        <!-- Logged in -->
        <ng-container *ngIf="auth.isLoggedIn()">
          <div class="hp-nav__profile" [class.open]="profileOpen">
            <button type="button" class="hp-nav__profile-btn" (click)="toggleProfileMenu()">
              <div class="hp-nav__avatar">
                {{ user?.fullName?.charAt(0) | uppercase }}
              </div>
              <div class="hp-nav__profile-name">
                <span>{{ user?.fullName }}</span>
                <small>{{ auth.isAdmin() ? 'Administrator' : 'Member' }}</small>
              </div>
              <i class="bi bi-chevron-down ms-1"></i>
            </button>
            <div class="hp-nav__profile-menu" *ngIf="profileOpen">
              <div class="hp-nav__profile-summary">
                <div class="hp-nav__profile-fullname">{{ user?.fullName }}</div>
                <div class="hp-nav__profile-email">{{ user?.email }}</div>
                <div class="hp-nav__profile-role">{{ auth.isAdmin() ? 'Administrator' : 'Member' }}</div>
              </div>
              <div class="hp-nav__profile-actions">
                <a routerLink="/my-bookings" class="hp-nav__profile-link" *ngIf="!auth.isAdmin()">
                  <i class="bi bi-calendar-check me-1"></i>My Bookings
                </a>
                <a routerLink="/admin" class="hp-nav__profile-link" *ngIf="auth.isAdmin()">
                  <i class="bi bi-speedometer2 me-1"></i>Admin Dashboard
                </a>
                <button type="button" class="hp-nav__profile-logout" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-1"></i>Logout
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</nav>
